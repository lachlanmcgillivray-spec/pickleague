# AUTO-SCORES-V1: fills in NFL winners on the site from ESPN's scoreboard.
# Runs every 30 minutes, and can also be run by hand from the Actions tab ("Run workflow").
name: Update scores

on:
  schedule:
    - cron: '7,37 * * * *'     # every 30 minutes (GitHub may start it a few minutes late)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: show what would change without saving'
        type: boolean
        default: false

concurrency:
  group: update-scores
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Firebase admin library
        run: npm install --no-save --no-audit --no-fund firebase-admin@12.7.0
      - name: Fill in winners
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: node scripts/update-scores.mjs
